<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="introSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a10"/>
      <stop offset="22%" stop-color="#020407"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="screenBurst" cx="50%" cy="8%" r="30%">
      <stop offset="0%" stop-color="#eaf9ff" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#5fd3f2" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#0e7fa3" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7fa3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfe9ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#bfe9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#54121c"/>
      <stop offset="55%" stop-color="#340a12"/>
      <stop offset="100%" stop-color="#15040a"/>
    </linearGradient>

    <symbol id="seat2" viewBox="0 0 100 120" width="100" height="120">
      <rect x="0" y="48" width="14" height="62" rx="6" fill="#060205" opacity="0.85"/>
