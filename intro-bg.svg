      <rect x="6" y="42" width="88" height="76" rx="14" fill="url(#velvet)"/>
      <rect x="10" y="0" width="80" height="54" rx="20" fill="url(#velvet)"/>
      <rect x="18" y="7" width="64" height="5" rx="2.5" fill="#000" opacity="0.28"/>
      <rect x="14" y="50" width="72" height="5" rx="2.5" fill="#000" opacity="0.22"/>
      <rect x="14" y="64" width="72" height="5" rx="2.5" fill="#000" opacity="0.16"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1200" height="1600" fill="url(#introSky)"/>
  <rect x="0" y="0" width="1200" height="1600" fill="url(#screenBurst)"/>

  <circle cx="150" cy="90" r="10" fill="url(#spot)"/>
