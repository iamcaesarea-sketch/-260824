<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineRec Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg:#0a0d12; --bg-alt:#12161d; --card:#151a22;
    --accent:#00d2ff; --danger:#ff4d6a; --text:#eef2f7; --text-dim:#98a3b3; --line:#232a35;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; padding:40px 20px;}
  h1{font-size:22px; margin:0 0 24px;}
  .login{max-width:360px; margin:80px auto; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:28px;}
  .login input{width:100%; background:var(--bg-alt); border:1px solid var(--line); color:var(--text); padding:10px 12px; border-radius:4px; font-size:14px; margin-bottom:12px;}
  button{font-size:14px; font-weight:600; padding:10px 18px; border-radius:4px; border:1px solid var(--accent); background:var(--accent); color:#04141c; cursor:pointer;}
  button:hover{background:#3ddcff;}
  button.ghost{background:transparent; border-color:var(--line); color:var(--text-dim);}
  button.ghost:hover{color:var(--text); border-color:var(--text-dim); background:transparent;}
  button:disabled{opacity:0.5; cursor:not-allowed;}
  .error{color:var(--danger); font-size:13px; margin-top:8px;}
  #dashboard{display:none; max-width:720px; margin:0 auto;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:10px;}
  .count{color:var(--text-dim); font-size:13px;}
  .toolbar-right{display:flex; gap:8px;}
  .date-tabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .date-tab{
    font-family:inherit; font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:16px;
    border:1px solid var(--line); background:var(--bg-alt); color:var(--text-dim); cursor:pointer;
  }
  .date-tab:hover{border-color:var(--text-dim); color:var(--text);}
  .date-tab.selected{border-color:var(--accent); background:rgba(0,210,255,0.12); color:var(--text);}
  .review-card{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:16px 18px; margin-bottom:14px;}
  .rc-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px 14px; flex-wrap:wrap; margin-bottom:4px;}
  .rc-title{font-size:16px; font-weight:700;}
  .rc-stars{color:var(--accent); font-size:13px; white-space:nowrap;}
  .rc-time{color:var(--text-dim); font-size:11.5px; margin-bottom:10px;}
  .rc-text{font-size:13.5px; line-height:1.6; white-space:pre-wrap; margin:0 0 10px;}
  .rc-aspects{color:var(--text-dim); font-size:11.5px; margin-bottom:6px;}
  .rc-filters{color:var(--accent-dim); font-size:11.5px;}
  .empty-note{color:var(--text-dim); font-size:13px; padding:20px 0;}
</style>
</head>
<body>

<div class="login" id="loginBox" style="display:none;">
  <h1>CineRec Admin</h1>
  <input type="password" id="pw" placeholder="관리자 비밀번호">
  <button id="loginBtn">로그인</button>
  <div class="error" id="loginError"></div>
</div>

<div id="dashboard">
  <h1>사용자 리뷰 데이터</h1>
  <div class="toolbar">
    <span class="count" id="count"></span>
    <div class="toolbar-right">
      <button class="ghost" id="refreshBtn">새로고침</button>
      <button class="ghost" id="logoutBtn">로그아웃</button>
    </div>
  </div>
  <div class="date-tabs" id="dateTabs"></div>
  <div id="reviewCards"></div>
</div>

<script>
const ASPECT_LABEL = {
  direction:'연출', script:'각본', originality:'독창성', theme:'주제', miseEnScene:'미장센',
  acting:'연기', genre:'장르', editing:'편집', music:'음악',
};
const TYPE_LABEL = { commercial:'상업 영화', indie:'독립 영화', short:'단편 영화' };

function filtersStr(f){
  if(!f) return '';
  const parts = [];
  if(f.genres && f.genres.length) parts.push('장르: '+f.genres.join(', '));
  if(f.runtime) parts.push('러닝타임 ≤'+f.runtime+'분');
  if(f.decade === 'classic') parts.push('고전영화(1980년 이전)');
  else if(f.decade) parts.push(f.decade+'년대');
  if(f.type && f.type!=='all') parts.push('유형: '+(TYPE_LABEL[f.type]||f.type));
  return parts.join(' · ') || '(선택 안 함)';
}

function starStr(rating){
  const full = Math.floor(rating);
  const half = rating - full >= 0.5;
  const empty = Math.max(0, 5 - full - (half?1:0));
  return '★'.repeat(full) + (half?'½':'') + '☆'.repeat(empty);
}

function showLogin(errMsg){
  document.querySelector('#dashboard').style.display = 'none';
  document.querySelector('#loginBox').style.display = 'block';
  document.querySelector('#loginError').textContent = errMsg || '';
}
function showDashboard(){
  document.querySelector('#loginBox').style.display = 'none';
  document.querySelector('#dashboard').style.display = 'block';
}

let allReviews = [];
let selectedDate = 'all';

function dateKeyOf(iso){
  return (iso || '').slice(0, 10);
}

async function loadReviews(){
  try{
    const res = await fetch('/api/list-reviews', { credentials: 'include' });
    if(res.status === 401){ showLogin(); return false; }
    if(res.status === 429){ showLogin('너무 많이 시도했어요. 잠시 후 다시 시도해 주세요.'); return false; }
    if(!res.ok){ showLogin('데이터를 불러오지 못했어요. (서버 환경변수 설정을 확인하세요)'); return false; }
    const data = await res.json();
    allReviews = data.reviews || [];
    selectedDate = 'all';
    renderReviews();
    showDashboard();
    return true;
  }catch(e){
    showLogin('요청 중 오류가 발생했어요.');
    return false;
  }
}

function renderReviews(){
  const tabsBox = document.querySelector('#dateTabs');
  const cardsBox = document.querySelector('#reviewCards');

  const dates = [...new Set(allReviews.map(r=> dateKeyOf(r.createdAt)))].sort((a,b)=> b.localeCompare(a));
  tabsBox.innerHTML = '';
  const allTab = document.createElement('button');
  allTab.type = 'button';
  allTab.className = 'date-tab' + (selectedDate==='all' ? ' selected' : '');
  allTab.textContent = '전체 (' + allReviews.length + ')';
  allTab.onclick = ()=>{ selectedDate = 'all'; renderReviews(); };
  tabsBox.appendChild(allTab);
  dates.forEach(d=>{
    const count = allReviews.filter(r=> dateKeyOf(r.createdAt)===d).length;
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'date-tab' + (selectedDate===d ? ' selected' : '');
    tab.textContent = d + ' (' + count + ')';
    tab.onclick = ()=>{ selectedDate = d; renderReviews(); };
    tabsBox.appendChild(tab);
  });

  const filtered = (selectedDate==='all' ? allReviews : allReviews.filter(r=> dateKeyOf(r.createdAt)===selectedDate))
    .slice()
    .sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));

  document.querySelector('#count').textContent = filtered.length + '개';
  cardsBox.innerHTML = '';
  if(filtered.length===0){
    cardsBox.innerHTML = '<div class="empty-note">표시할 리뷰가 없어요.</div>';
    return;
  }
  filtered.forEach(r=>{
    const aspectsStr = Object.entries(r.aspects||{})
      .map(([k,v])=> (ASPECT_LABEL[k]||k) + ' ' + v)
      .join(' · ');
    const card = document.createElement('div');
    card.className = 'review-card';
    card.innerHTML = `
      <div class="rc-head">
        <span class="rc-title">${r.title || ''}</span>
        <span class="rc-stars">${starStr(r.rating)} (${r.rating})</span>
      </div>
      <div class="rc-time">${new Date(r.createdAt).toLocaleString('ko-KR')} · ${r.lang || ''}</div>
      ${r.reviewText ? `<div class="rc-text">${r.reviewText.replace(/</g,'&lt;')}</div>` : ''}
      ${aspectsStr ? `<div class="rc-aspects">${aspectsStr}</div>` : ''}
      <div class="rc-filters">${filtersStr(r.filters)}</div>
    `;
    cardsBox.appendChild(card);
  });
}

document.querySelector('#loginBtn').onclick = async ()=>{
  const btn = document.querySelector('#loginBtn');
  btn.disabled = true;
  document.querySelector('#loginError').textContent = '';
  try{
    const res = await fetch('/api/admin-login', {
      method: 'POST',
      credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ password: document.querySelector('#pw').value }),
    });
    if(res.status === 429){ document.querySelector('#loginError').textContent = '너무 많이 틀렸어요. 잠시 후 다시 시도해 주세요.'; return; }
    if(!res.ok){ document.querySelector('#loginError').textContent = '비밀번호가 올바르지 않아요.'; return; }
    document.querySelector('#pw').value = '';
    await loadReviews();
  }catch(e){
    document.querySelector('#loginError').textContent = '요청 중 오류가 발생했어요.';
  }finally{
    btn.disabled = false;
  }
};
document.querySelector('#pw').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.querySelector('#loginBtn').click();
});
document.querySelector('#refreshBtn').onclick = ()=> loadReviews();
document.querySelector('#logoutBtn').onclick = async ()=>{
  try{ await fetch('/api/admin-logout', { method:'POST', credentials:'include' }); }catch(e){}
  showLogin();
};

// 페이지 열자마자 기존 세션 쿠키가 유효한지 먼저 확인 (유효하면 비번 다시 안 물어봄)
loadReviews();
</script>
</body>
</html>
